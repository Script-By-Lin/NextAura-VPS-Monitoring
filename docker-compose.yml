services:
  # ============================================================================
  # 1. METRICS & CORE MONITORING ENGINE
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vps-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./configs/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 2. INFRASTRUCTURE EXPORTERS
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: vps-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100"
    networks:
      - monitoring_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: vps-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8080}:8080"
    networks:
      - monitoring_net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: vps-blackbox-exporter
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./configs/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:${BLACKBOX_PORT:-9115}:9115"
    networks:
      - monitoring_net

  # ============================================================================
  # 3. DISTRIBUTED TRACING & OPENTELEMETRY
  # ============================================================================
  tempo:
    image: grafana/tempo:2.4.1
    container_name: vps-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./configs/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"     # Tempo HTTP
      - "127.0.0.1:4319:4317"                    # OTLP gRPC receiver direct to Tempo (internal backup)
    networks:
      - monitoring_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: vps-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/otel-collector.yml"]
    volumes:
      - ./configs/otel-collector/otel-collector.yml:/etc/otel-collector/otel-collector.yml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317" # OTLP gRPC receiver
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318" # OTLP HTTP receiver
      - "127.0.0.1:8889:8889"                    # Prometheus metrics exporter from Collector
    networks:
      - monitoring_net
    depends_on:
      - tempo

  # ============================================================================
  # 4. LOG AGGREGATION & SHIPPING
  # ============================================================================
  loki:
    image: grafana/loki:2.9.6
    container_name: vps-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  promtail:
    image: grafana/promtail:2.9.6
    container_name: vps-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./configs/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - app_logs:/app_logs:ro
      - nginx_logs:/nginx_logs:ro
    networks:
      - monitoring_net
    depends_on:
      - loki

  # ============================================================================
  # 5. ALERTING ENGINE
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: vps-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./configs/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - monitoring_net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 6. VISUALIZATION (GRAFANA)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: vps-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_secure_pass_change_me}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-polystat-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_METRICS_ENABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki
      - tempo

  # ============================================================================
  # 7. INSTRUMENTED APPLICATION (FASTAPI APM DEMO)
  # ============================================================================
  fastapi-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: vps-fastapi-app
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=fastapi-production-service
      - LOG_FILE_PATH=/var/log/fastapi/app.log
    volumes:
      - app_logs:/var/log/fastapi
    ports:
      - "127.0.0.1:${FASTAPI_PORT:-8000}:8000"
    networks:
      - monitoring_net
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 8. SECURITY & EDGE GATEWAY (NGINX)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: vps-nginx-proxy
    restart: unless-stopped
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks:
      - monitoring_net
    depends_on:
      - grafana
      - fastapi-app

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================
networks:
  monitoring_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local
