upstream grafana_upstream {
    server grafana:3000;
}

upstream fastapi_upstream {
    server fastapi-app:8000;
    keepalive 32;
}

upstream prometheus_upstream {
    server prometheus:9090;
}

server {
    listen 80;
    server_name _;

    # Client Body Limit
    client_max_body_size 50M;

    # 1. Grafana Monitoring UI (Default root access)
    location / {
        proxy_pass http://grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. FastAPI Application Proxy
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. FastAPI Authentication Endpoint (Stricter Rate Limiting)
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. FastAPI Direct Health & Metrics Passthrough
    location /health/ {
        proxy_pass http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 5. Protected Prometheus Endpoint (Private access only)
    location /prometheus/ {
        # Allow internal network / localhost only
        allow 127.0.0.1;
        allow 172.28.0.0/16;
        deny all;

        proxy_pass http://prometheus_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
