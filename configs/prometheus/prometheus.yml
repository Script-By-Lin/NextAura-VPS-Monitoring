global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'vps-enterprise-monitor'
    environment: 'production'
    cluster: 'primary-vps-node'

# Alertmanager Configuration
alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ['alertmanager:9093']

# Rule Files
rule_files:
  - 'alerts.yml'
  - 'recording_rules.yml'

# Scrape Configurations
scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. Prometheus Self-Monitoring
  # ----------------------------------------------------------------------------
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          tier: 'monitoring'
          service: 'prometheus'

  # ----------------------------------------------------------------------------
  # 2. Host Infrastructure (Node Exporter)
  # ----------------------------------------------------------------------------
  - job_name: 'node-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          tier: 'infrastructure'
          host: 'vps-master'

  # ----------------------------------------------------------------------------
  # 3. Container Resource Usage (cAdvisor)
  # ----------------------------------------------------------------------------
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          tier: 'infrastructure'
          host: 'vps-master'
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service

  # ----------------------------------------------------------------------------
  # 4. FastAPI Application Layer (Direct Prometheus Client)
  # ----------------------------------------------------------------------------
  - job_name: 'fastapi-app'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['fastapi-app:8000']
        labels:
          tier: 'application'
          service: 'fastapi-service'
          app: 'fastapi-app'

  # ----------------------------------------------------------------------------
  # 5. OpenTelemetry Collector Ingested Metrics
  # ----------------------------------------------------------------------------
  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          tier: 'telemetry'
          service: 'otel-collector'

  # ----------------------------------------------------------------------------
  # 6. Log & Trace Backends (Loki & Tempo)
  # ----------------------------------------------------------------------------
  - job_name: 'loki'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['loki:3100']
        labels:
          tier: 'logging'
          service: 'loki'

  - job_name: 'tempo'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          tier: 'tracing'
          service: 'tempo'

  # ----------------------------------------------------------------------------
  # 7. Alertmanager Self-Monitoring
  # ----------------------------------------------------------------------------
  - job_name: 'alertmanager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          tier: 'alerting'
          service: 'alertmanager'

  # ----------------------------------------------------------------------------
  # 8. Blackbox Synthetic Uptime Prober (HTTP Checks)
  # ----------------------------------------------------------------------------
  - job_name: 'blackbox-http'
    metrics_path: '/probe'
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://fastapi-app:8000/health/live'
          - 'http://fastapi-app:8000/health/ready'
        labels:
          probe_type: 'http'
          tier: 'synthetic-probes'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
