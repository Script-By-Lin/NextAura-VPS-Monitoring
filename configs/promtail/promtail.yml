server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Structured Application Logs
  # ----------------------------------------------------------------------------
  - job_name: fastapi-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: fastapi-app
          app: fastapi-app
          env: production
          __path__: /app_logs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            span_id: span_id
            endpoint: endpoint
            client_ip: client_ip
            status_code: status_code
      - labels:
          level:
          endpoint:
          status_code:

  # ----------------------------------------------------------------------------
  # 2. Nginx Access & Error Logs
  # ----------------------------------------------------------------------------
  - job_name: nginx-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          app: nginx
          env: production
          __path__: /nginx_logs/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[\w\.]+) - (?P<remote_user>[^ ]*) \[(?P<time_local>.*)\] "(?P<method>[^ ]*) (?P<request_uri>[^ ]*) (?P<protocol>[^ ]*)" (?P<status>[\d]+) (?P<body_bytes_sent>[\d]+)'
      - labels:
          status:
          method:

  # ----------------------------------------------------------------------------
  # 3. Docker Container Standard Out & Error Logs
  # ----------------------------------------------------------------------------
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
