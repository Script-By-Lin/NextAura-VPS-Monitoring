[Definition]

# Action executed on starting jail
actionstart = 

# Action executed on stopping jail
actionstop = 

# Action executed on banning IP
actionban = curl -s -X POST "https://api.telegram.org/bot<telegram_bot_token>/sendMessage" \
            -d "chat_id=<telegram_chat_id>" \
            -d "parse_mode=HTML" \
            -d "text=🛡️ <b>[SECURITY ALERT - IP BANNED]</b>%0A%0A<b>Jail:</b> <code><name></code>%0A<b>Banned IP:</b> <code><ip></code>%0A<b>Failures:</b> <failures>%0A<b>Duration:</b> <bantime>s%0A<b>Host:</b> $(hostname)"

# Action executed on unbanning IP
actionunban = curl -s -X POST "https://api.telegram.org/bot<telegram_bot_token>/sendMessage" \
              -d "chat_id=<telegram_chat_id>" \
              -d "parse_mode=HTML" \
              -d "text=🔓 <b>[SECURITY NOTICE - IP UNBANNED]</b>%0A%0A<b>Jail:</b> <code><name></code>%0A<b>Unbanned IP:</b> <code><ip></code>"

[Init]
telegram_bot_token = ${TELEGRAM_BOT_TOKEN}
telegram_chat_id = ${TELEGRAM_CHAT_ID}
