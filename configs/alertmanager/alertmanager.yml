global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@monitoring.local'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service', 'severity']
  group_wait: 10s
  group_interval: 2m
  repeat_interval: 4h
  receiver: 'default-webhook'
  routes:
    # Critical infrastructure & security alerts get fast-tracked
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 1h

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 4h

inhibit_rules:
  # Suppress warning alerts if a critical alert for the same instance is already firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://fastapi-app:8000/health/live'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://fastapi-app:8000/health/live'
        send_resolved: true

  - name: 'warning-alerts'
    webhook_configs:
      - url: 'http://fastapi-app:8000/health/live'
        send_resolved: true

  - name: 'email-fallback'
    email_configs:
      - to: 'admin@example.com'
        send_resolved: true
